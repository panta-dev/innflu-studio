name = "innflu-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Servir o dashboard estático integrado (Cloudflare Pages / Assets)
[assets]
directory = "./public"
binding = "ASSETS"

# Banco de dados Serverless SQLite Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "innflu-db"
database_id = "03290e99-4ad0-4c83-8291-402104b05a4f"

# Módulo de Inteligência Artificial para classificação de perfil
[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
DEFAULT_DAILY_LIMIT = "50"
